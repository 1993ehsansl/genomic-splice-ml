name: Python CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev,api]'
      - run: pytest -q
      - name: Exercise deterministic synthetic smoke test (NOT real results)
        run: python -m genosplice.train --demo --out /tmp/splice-smoke
