[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genomic-splice-ml"
version = "0.1.0"
description = "Reproducible genomics ML benchmarking for DNA splice-junction classification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=2.0,<3", "scipy>=1.10,<2", "scikit-learn>=1.3,<2", "matplotlib>=3.7,<4", "joblib>=1.3,<2"]

[project.optional-dependencies]
api = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1", "pydantic>=2,<3"]
deep = ["torch>=2.1,<3"]
dev = ["pytest>=7.4,<10", "httpx>=0.25,<1", "ruff>=0.5,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
